services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campaigns
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [campaign_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campaigns"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build: .
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/campaigns
      JWT_SECRET_KEY: replace-this-in-real-deployments
      FRONTEND_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      PUBLIC_BASE_URL: http://localhost:8000
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/campaigns
      JWT_SECRET_KEY: replace-this-in-real-deployments
      FRONTEND_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      PUBLIC_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  campaign_postgres:
