name: Backend CI
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campaigns
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campaigns"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q app tests
      - name: Validate operational scripts
        run: bash -n scripts/backup_postgres.sh scripts/restore_postgres.sh
      - name: Verify PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campaigns
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-with-at-least-32-bytes
          COOKIE_SECURE: "false"
          PUBLIC_BASE_URL: http://localhost:8000
        run: alembic upgrade head
      - name: Check migration/model parity
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campaigns
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-with-at-least-32-bytes
          COOKIE_SECURE: "false"
          PUBLIC_BASE_URL: http://localhost:8000
        run: alembic check
      - name: Run API tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campaigns
          REDIS_TEST_URL: redis://localhost:6379/15
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-with-at-least-32-bytes
          COOKIE_SECURE: "false"
          PUBLIC_BASE_URL: http://localhost:8000
        run: pytest -q
      - name: Validate Docker Compose
        run: docker compose config
      - name: Reject incomplete production configuration
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.production.yml config >/dev/null 2>&1; then
            echo "Production Compose unexpectedly accepted missing deployment configuration." >&2
            exit 1
          fi
      - name: Validate production Compose overlay
        env:
          ENVIRONMENT: production
          POSTGRES_USER: campaign_app
          POSTGRES_DB: campaigns
          POSTGRES_PASSWORD: 8b2f7e6a3c1d9e0f4a8b7c6d5e4f3a291817161514131211
          REDIS_PASSWORD: 4c09f1c8aab8d14e905e1f1f7f03e6c1a55bb8be1f62d540
          FORWARDED_ALLOW_IPS: 172.30.240.2,127.0.0.1
          SMTP_HOST: smtp.example.com
          SMTP_FROM_EMAIL: ci@example.com
          JWT_SECRET_KEY: ci-only-production-secret-0123456789abcdef0123456789abcdef
          FRONTEND_DOMAIN: app.example.com
          API_DOMAIN: api.example.com
          FRONTEND_ORIGIN: https://app.example.com
          COOKIE_SECURE: "true"
          COOKIE_NAME: __Host-campaign_session
          PUBLIC_BASE_URL: https://api.example.com
        run: |
          docker compose -f docker-compose.yml -f docker-compose.production.yml config
          docker compose -f docker-compose.yml -f docker-compose.api-production.yml config
      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -e FRONTEND_DOMAIN=app.example.com \
            -e API_DOMAIN=api.example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm \
            -e API_DOMAIN=api.example.com \
            -v "$PWD/Caddyfile.api-only:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build API image
        run: docker build --pull=false -t campaign-management-api:ci .
      - name: Verify API image runs as non-root
        run: test "$(docker run --rm --entrypoint id campaign-management-api:ci -u)" = "10001"
