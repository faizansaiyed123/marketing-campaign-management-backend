name: Backend CI
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campaigns
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campaigns"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q app tests
      - name: Verify PostgreSQL migration
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campaigns
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret
          COOKIE_SECURE: "false"
        run: alembic upgrade head
      - name: Run API tests
        run: pytest -q
