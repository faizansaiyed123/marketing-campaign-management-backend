name: Backend CI
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campaigns
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campaigns"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q app tests
      - name: Verify PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campaigns
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-with-at-least-32-bytes
          COOKIE_SECURE: "false"
          PUBLIC_BASE_URL: http://localhost:8000
        run: alembic upgrade head
      - name: Check migration/model parity
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campaigns
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-with-at-least-32-bytes
          COOKIE_SECURE: "false"
          PUBLIC_BASE_URL: http://localhost:8000
        run: alembic check
      - name: Run API tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campaigns
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-test-secret-with-at-least-32-bytes
          COOKIE_SECURE: "false"
          PUBLIC_BASE_URL: http://localhost:8000
        run: pytest -q
      - name: Validate Docker Compose
        run: docker compose config
      - name: Build API image
        run: docker build --pull=false -t campaign-management-api:ci .
